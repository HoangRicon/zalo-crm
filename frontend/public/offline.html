<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZCRM — Offline</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; padding: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 380px; text-align: center; padding: 24px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.05); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 16px; color: #64748b; line-height: 1.5; }
    button { background: #1f6feb; color: #fff; border: 0; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1858c4; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📴 Đang offline</h1>
    <p>Bạn đang ngoại tuyến. ZCRM sẽ đồng bộ lại khi có kết nối Internet.</p>
    <button onclick="window.location.reload()">Thử lại</button>
  </div>
</body>
</html>
